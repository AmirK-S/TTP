name: Release TTP

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Detect whether this tag targets the beta channel.
      # Convention (since v3.0.1): numeric-only pre-release suffix
      # like `v3.1.0-1`, `v3.1.0-2`. MSI bundler accepts numeric
      # pre-releases (since tauri-bundler v1.2.0) but rejects alphanumeric
      # ones like `-beta.N` — see ARCHITECTURE.md for the long history.
      # The legacy `-beta.N` pattern is still matched for backward
      # compatibility with the v3.0.0-beta.1..4 tags already in the wild.
      # Outputs:
      #   is_beta = "true" | "false"
      #   channel = "beta" | "stable"
      - name: Detect beta tag
        id: beta-check
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # Accept only:
          #   vX.Y.Z           — stable
          #   vX.Y.Z-N         — numeric beta (current convention)
          #   vX.Y.Z-beta.N    — legacy beta (preserved for v3.0.0-beta.1..4)
          # Reject ANY other pre-release suffix (rc, hotfix, canary, dash with
          # nothing after) so a malformed tag can't ship to /releases/latest
          # as a stable build. Without this guard, `v3.0.5-rc.1` would have
          # been promoted to `--latest` and silently overwritten the stable
          # auto-updater pointer.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag $TAG has an unrecognised format. Use vX.Y.Z (stable) or vX.Y.Z-N (numeric beta)."
            exit 1
          fi

      # Cross-check the tag against the version baked into the source. Without
      # this, you can push tag v3.0.5 against a commit where Cargo.toml +
      # package.json still say 3.0.4 — the build produces a v3.0.4 binary and
      # uploads it to release v3.0.5. The updater manifest takes its version
      # from Cargo.toml/tauri.conf.json, so the manifest would mismatch the
      # tag and users would re-install the same build on every check.
      - name: Verify tag matches source version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # Strip the leading 'v' and any pre-release suffix to get the bare
          # vX.Y.Z core for comparison.
          TAG_VERSION="${TAG#v}"
          TAG_CORE="${TAG_VERSION%%-*}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          CARGO_VERSION=$(grep -E '^version = ' src-tauri/Cargo.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG_CORE" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG core $TAG_CORE does not match package.json version $PKG_VERSION"
            exit 1
          fi
          if [ "$TAG_CORE" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG core $TAG_CORE does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "Tag $TAG matches source version $TAG_CORE (package.json + Cargo.toml)."

      # On Windows + beta tags, skip the MSI bundler. MSI rejects non-numeric
      # SemVer pre-release identifiers (e.g. -beta.1) — see tauri-apps/tauri
      # issue. NSIS .exe still ships and is sufficient for beta-channel users.
      # Stable Windows builds keep both NSIS + MSI.
      - name: Compute build args
        id: build-args
        shell: bash
        run: |
          ARGS="${{ matrix.args }}"
          if [[ "${{ matrix.platform }}" == "windows-latest" && "${{ steps.beta-check.outputs.is_beta }}" == "true" ]]; then
            ARGS="${ARGS:+$ARGS }--bundles nsis"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2025-12-16
        with:
          # Pin the toolchain explicitly. Without a `toolchain:` input, the
          # action installs whatever is the latest stable rustc at run time,
          # so two release builds of the same git SHA can produce different
          # binaries depending on when CI ran. Bump this deliberately via PR.
          #
          # 2026-06-10: bumped from 1.85.0 to 1.90.0 — transitive deps (time,
          # time-core, time-macros) require ≥1.88.0. 1.90.0 is the latest
          # stable at pin time and gives margin for future minor dep bumps.
          toolchain: '1.90.0'
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          workspaces: src-tauri -> target

      # `cmake`, `opus`, `pkg-config`, and the `OPUS_NO_PKG_CONFIG` /
      # `CMAKE_POLICY_VERSION_MINIMUM` env vars used to be installed here to
      # support an opus cross-compile that no longer exists. Cargo.toml only
      # enables `rodio` with `features = ["wav"]`, cpal needs neither cmake
      # nor opus, and `grep opus Cargo.lock` returns zero matches. The
      # ~30-60s of brew time per macOS run that this saves is non-trivial.

      - name: Install frontend dependencies
        run: npm ci

      # Run Rust tests once on macOS arm64 — short-circuits the release if
      # something regressed. Skipped on the other matrix entries to avoid
      # paying the test cost three times for the same code.
      - name: Run Rust tests
        if: matrix.target == 'aarch64-apple-darwin'
        working-directory: src-tauri
        run: cargo test --lib

      # Windows certificate import + thumbprint wire-through.
      #
      # Before this step, the certificate was imported into the runner's
      # CurrentUser cert store but tauri.conf.json carried
      # `"certificateThumbprint": null`, so the Tauri Windows bundler never
      # invoked signtool. The NSIS .exe and MSI shipped UNSIGNED — every
      # SmartScreen prompt showed "Unknown publisher" and the certificate
      # was effectively unused.
      #
      # Now: extract the thumbprint from the imported .pfx and rewrite the
      # null field in tauri.conf.json before the build runs. We rewrite the
      # file (rather than passing via env) because tauri-action does not
      # forward the env var into the bundler config at build time.
      - name: Import Windows Certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          # Read the thumbprint back from the .pfx and inject it into the
          # Tauri config so the bundler actually invokes signtool.
          $thumb = (Get-PfxCertificate -FilePath certificate/certificate.pfx).Thumbprint
          Write-Host "Windows certificate thumbprint: $thumb"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw
          $conf = $conf -replace '"certificateThumbprint":\s*null', "`"certificateThumbprint`": `"$thumb`""
          Set-Content -Path src-tauri/tauri.conf.json -Value $conf -NoNewline

      # Apple Developer ID certificate import — MANDATORY for release tags.
      # Releases must be signed and notarized; we fail loudly if the secret is
      # missing rather than silently shipping an unsigned binary that Gatekeeper
      # will reject for end users.
      - name: Import Apple Certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::error::APPLE_CERTIFICATE secret is not set — release builds must be signed."
            exit 1
          fi
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode --output $CERT_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      # Verify the codesign identity actually loaded into the keychain. If the
      # secret is corrupt or empty, this catches it BEFORE we waste 8 minutes
      # building a binary we can't sign.
      - name: Verify codesign identity (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          if ! security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db | grep -q "Developer ID Application"; then
            echo "::error::No 'Developer ID Application' identity found after cert import — secret is corrupt or wrong type."
            security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db || true
            exit 1
          fi
          echo "Codesign identity verified."

      # Decode the App Store Connect API key (.p8) from the base64 secret
      # and persist its on-disk path via $GITHUB_ENV so subsequent steps
      # can pass it to notarytool via Tauri's APPLE_API_KEY_PATH env var.
      #
      # We moved off Apple-ID + app-specific-password auth on 2026-05-23
      # because changing the iCloud password revokes ALL app-specific
      # passwords, and repeated 401s lock the Apple ID at the API layer
      # (independent of web/passkey login). App Store Connect API keys are
      # ECC JWT-signed, don't touch the Apple ID password path, and survive
      # iCloud password changes.
      - name: Write App Store Connect API key (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Build + bundle + sign + notarize + upload. Apple's notary service
      # (appstoreconnect.apple.com) flakes occasionally with DNS errors; we
      # automatically retry up to 2 more times before giving up. tauri-action
      # is idempotent w/r/t the GitHub Release draft so retries are safe.
      - name: Build and Release (attempt 1)
        id: tauri-1
        continue-on-error: true
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Tauri reads the *Key ID* (10 chars) from APPLE_API_KEY,
          # NOT the .p8 file contents. The .p8 path comes from
          # APPLE_API_KEY_PATH, exported by the "Write App Store Connect
          # API key" step above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TTP ${{ github.ref_name }}"
          releaseBody: "See the assets below for downloadable installers."
          releaseDraft: true
          # Beta tags (vX.Y.Z-beta.N) are marked prerelease so GitHub does not
          # promote them to /releases/latest and stable users keep getting the
          # latest stable manifest.
          prerelease: ${{ steps.beta-check.outputs.is_beta == 'true' }}
          args: ${{ steps.build-args.outputs.args }}

      - name: Wait before retry
        if: steps.tauri-1.outcome == 'failure'
        run: sleep 30

      - name: Build and Release (attempt 2)
        id: tauri-2
        if: steps.tauri-1.outcome == 'failure'
        continue-on-error: true
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Tauri reads the *Key ID* (10 chars) from APPLE_API_KEY,
          # NOT the .p8 file contents. The .p8 path comes from
          # APPLE_API_KEY_PATH, exported by the "Write App Store Connect
          # API key" step above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TTP ${{ github.ref_name }}"
          releaseBody: "See the assets below for downloadable installers."
          releaseDraft: true
          prerelease: ${{ steps.beta-check.outputs.is_beta == 'true' }}
          args: ${{ steps.build-args.outputs.args }}

      - name: Wait before final attempt
        if: steps.tauri-1.outcome == 'failure' && steps.tauri-2.outcome == 'failure'
        run: sleep 60

      - name: Build and Release (attempt 3 — final)
        id: tauri-3
        if: steps.tauri-1.outcome == 'failure' && steps.tauri-2.outcome == 'failure'
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Tauri reads the *Key ID* (10 chars) from APPLE_API_KEY,
          # NOT the .p8 file contents. The .p8 path comes from
          # APPLE_API_KEY_PATH, exported by the "Write App Store Connect
          # API key" step above.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TTP ${{ github.ref_name }}"
          releaseBody: "See the assets below for downloadable installers."
          releaseDraft: true
          prerelease: ${{ steps.beta-check.outputs.is_beta == 'true' }}
          args: ${{ steps.build-args.outputs.args }}

      # Upload debug symbols to Sentry so future stack traces are
      # symbolicated. Without this, panics show as `__mh_execute_header`
      # at raw addresses (which is what we hit on TTP-7/A/B). Skipped
      # silently when SENTRY_AUTH_TOKEN isn't set so forks of the repo
      # don't fail the release.
      - name: Upload debug symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: aks-12
          SENTRY_PROJECT: ttp
        shell: bash
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          # Cargo with split-debuginfo=packed emits .dSYM (macOS) or .pdb
          # (Windows) sidecars next to the release binary in the target
          # directory. sentry-cli walks the tree.
          sentry-cli debug-files upload \
            --include-sources \
            "src-tauri/target/${{ matrix.target }}/release/" \
            || sentry-cli debug-files upload \
              --include-sources \
              "src-tauri/target/release/"

          # JS sourcemaps: vite.config.ts emits .map sidecars alongside the
          # bundled JS via `build.sourcemap: "hidden"` (no sourceMappingURL
          # comment, so end-user devtools don't see them). We upload the maps
          # to Sentry keyed by the package.json version so server-side
          # symbolication resolves minified frames in @sentry/react events.
          #
          # Only run once per release (macOS arm64) to avoid uploading the
          # same artifacts three times across the matrix.
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]] && [ -d dist ]; then
            REL_VERSION=$(node -p "require('./package.json').version")
            echo "Uploading JS sourcemaps for release $REL_VERSION"
            sentry-cli sourcemaps inject ./dist || true
            sentry-cli sourcemaps upload \
              --release "$REL_VERSION" \
              ./dist || true
          fi

      # Upload a stable-named alias so /releases/latest/download/<stable> works
      # without the consumer having to know the version. Versioned originals
      # are preserved alongside.
      - name: Upload stable-named macOS alias
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          SRC=$(ls "$BUNDLE_DIR"/*.dmg 2>/dev/null | head -1)
          if [ -z "$SRC" ]; then
            echo "No DMG produced in $BUNDLE_DIR; skipping alias upload."
            exit 0
          fi
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) DEST="TTP-macOS-arm64.dmg" ;;
            x86_64-apple-darwin)  DEST="TTP-macOS-x64.dmg" ;;
            *) echo "Unknown target ${{ matrix.target }}"; exit 1 ;;
          esac
          cp "$SRC" "$DEST"
          gh release upload "${{ github.ref_name }}" "$DEST" --clobber --repo "${{ github.repository }}"

      - name: Upload stable-named Windows aliases
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Beta builds skip the MSI bundler (MSI rejects non-numeric
          # pre-release identifiers like -beta.1), so the msi/ directory
          # may not exist. GitHub's bash runs with `pipefail`, so we
          # check the directory exists before find-ing — otherwise find
          # returns 1, the pipe is non-zero, and set -e kills the step.
          EXE=""
          if [ -d "src-tauri/target/release/bundle/nsis" ]; then
            EXE=$(find src-tauri/target/release/bundle/nsis -name "*-setup.exe" -print -quit 2>/dev/null || true)
          fi
          MSI=""
          if [ -d "src-tauri/target/release/bundle/msi" ]; then
            MSI=$(find src-tauri/target/release/bundle/msi -name "*.msi" -print -quit 2>/dev/null || true)
          fi
          UPLOADS=()
          if [ -n "$EXE" ]; then
            cp "$EXE" "TTP-Windows-x64-setup.exe"
            UPLOADS+=("TTP-Windows-x64-setup.exe")
          fi
          if [ -n "$MSI" ]; then
            cp "$MSI" "TTP-Windows-x64.msi"
            UPLOADS+=("TTP-Windows-x64.msi")
          fi
          if [ ${#UPLOADS[@]} -gt 0 ]; then
            gh release upload "${{ github.ref_name }}" "${UPLOADS[@]}" --clobber --repo "${{ github.repository }}"
          else
            echo "No Windows installers produced; skipping alias upload."
          fi

  # Publish the channel-specific update manifest. Runs once after all matrix
  # jobs have uploaded their per-target artifacts so that latest.json on the
  # GitHub release is fully merged across macOS arm64 / x64 / Windows.
  #
  # Stable tag (vX.Y.Z): copy this release's latest.json to latest-beta.json
  # and attach it here too, so beta-channel users on this stable build can
  # roll forward to the next beta from this release's URL.
  #
  # Beta tag (vX.Y.Z-beta.N): the release is prerelease, so it is NOT
  # /releases/latest. We download this release's latest.json, rename it to
  # latest-beta.json, and re-upload it to the most recent NON-prerelease
  # release (which is what /releases/latest points to). Beta-channel users
  # querying /releases/latest/download/latest-beta.json then get the new beta.
  publish-channel-manifest:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Detect beta tag
        id: beta-check
        shell: bash
        run: |
          # MUST stay in sync with the regex in the build job at the top of
          # this file. Without that, a numeric-pre-release tag like
          # `v3.1.0-1` would be classified differently between the two jobs
          # — the build job builds a beta but the publish job tries to mark
          # the release as latest, hitting HTTP 422 from GitHub.
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag $TAG has an unrecognised format. Use vX.Y.Z (stable) or vX.Y.Z-N (numeric beta)."
            exit 1
          fi

      - name: Publish latest-beta.json (stable tag)
        if: steps.beta-check.outputs.is_beta == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          # Wait briefly for tauri-action's last upload to settle on the API.
          sleep 5
          mkdir -p _channel
          if ! gh release download "${{ github.ref_name }}" \
              --pattern 'latest.json' \
              --repo "${{ github.repository }}" \
              --dir _channel; then
            echo "::warning::No latest.json on release ${{ github.ref_name }}; skipping latest-beta.json publication."
            exit 0
          fi
          cp _channel/latest.json _channel/latest-beta.json
          gh release upload "${{ github.ref_name }}" _channel/latest-beta.json \
            --clobber --repo "${{ github.repository }}"

      - name: Publish latest-beta.json (beta tag)
        if: steps.beta-check.outputs.is_beta == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          sleep 5
          mkdir -p _channel
          # Pull THIS beta release's latest.json (tauri-action wrote one).
          if ! gh release download "${{ github.ref_name }}" \
              --pattern 'latest.json' \
              --repo "${{ github.repository }}" \
              --dir _channel; then
            echo "::error::No latest.json found on beta release ${{ github.ref_name }}."
            exit 1
          fi
          cp _channel/latest.json _channel/latest-beta.json

          # Find the most recent NON-prerelease tag — that's what
          # /releases/latest/download/<asset> resolves to.
          STABLE_TAG=$(gh release list --limit 50 --repo "${{ github.repository }}" \
            --json tagName,isPrerelease,isDraft \
            | jq -r '[.[] | select(.isPrerelease == false and .isDraft == false)] | .[0].tagName // empty')
          if [ -z "$STABLE_TAG" ]; then
            echo "::error::No published stable release found to attach latest-beta.json to."
            exit 1
          fi
          echo "Attaching latest-beta.json to stable release: $STABLE_TAG"
          gh release upload "$STABLE_TAG" _channel/latest-beta.json \
            --clobber --repo "${{ github.repository }}"

      # Flip the GitHub Release from draft to published. The release-matrix job
      # creates it as a draft on purpose (so tauri-action's per-platform retry
      # attempts are idempotent against the same draft), and historically there
      # was no follow-up step to publish it — v2.1.6 and v2.1.7 shipped green
      # in CI but stayed draft, leaving auto-updaters on v2.1.5 forever until
      # the drafts were manually promoted. This step runs after all platform
      # artifacts AND the channel manifest have been uploaded so when the
      # release goes live, every asset is already attached.
      - name: Publish release (flip draft → live)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          if [ "${{ steps.beta-check.outputs.is_beta }}" = "true" ]; then
            # Beta tag: publish but stay prerelease and EXPLICITLY do NOT mark
            # as latest, so stable-channel users keep pointing at the most
            # recent stable. We pass `--latest=false` explicitly because
            # without it gh inherits whatever flag the release was created
            # with (tauri-action's default leaves it ambiguous), and GitHub
            # then rejects the prerelease flag with HTTP 422
            # ("Latest release cannot be draft or prerelease.").
            gh release edit "${{ github.ref_name }}" \
              --draft=false --prerelease --latest=false \
              --repo "${{ github.repository }}"
          else
            # Stable tag: publish and explicitly mark as latest so
            # /releases/latest/download/latest.json resolves here.
            gh release edit "${{ github.ref_name }}" \
              --draft=false --latest \
              --repo "${{ github.repository }}"
          fi
