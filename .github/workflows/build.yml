name: Build TTP

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

# build.yml only needs to read the repo and write artifacts; no need for
# contents:write or any token elevation.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2025-12-16
        with:
          # Pinned in lockstep with release.yml so build.yml's "does it
          # compile?" check uses the same compiler as the actual release.
          # See release.yml for the rationale behind the 1.90.0 pin.
          toolchain: '1.90.0'
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          workspaces: src-tauri -> target

      # `cmake`/`opus`/`pkg-config` install + cross-compile env removed: see
      # release.yml for the same rationale. Nothing in Cargo.lock uses opus.

      - name: Install frontend dependencies
        run: npm ci

      # Detect whether the current package.json version is a beta build (e.g.
      # "2.0.2-beta.5"). The MSI bundler rejects non-numeric SemVer pre-release
      # identifiers, so we mirror release.yml's behaviour and skip MSI on
      # Windows when the version is beta. NSIS .exe still builds and is the
      # primary Windows distribution channel.
      - name: Detect beta version
        id: beta-check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -beta\.[0-9]+$ ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute build args
        id: build-args
        shell: bash
        run: |
          ARGS="${{ matrix.args }}"
          if [[ "${{ matrix.platform }}" == "windows-latest" && "${{ steps.beta-check.outputs.is_beta }}" == "true" ]]; then
            ARGS="${ARGS:+$ARGS }--bundles nsis"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      # Run Rust tests once on macOS — short-circuits the build if something
      # regressed. Skipped on Windows to avoid duplicating the cost.
      - name: Run Rust tests
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: build.yml no longer exposes the updater signing key.
          # This workflow is "does it compile + tests pass?" — the artifacts
          # produced here are for review (via actions/upload-artifact), not
          # for end-user delivery. Skipping the signing key avoids leaking
          # it to internal-branch PR builds and shaves seconds off the
          # bundler signature step. release.yml is the only path that signs
          # updater bundles.
        with:
          args: ${{ steps.build-args.outputs.args }}

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: TTP-macOS
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          retention-days: 7

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: TTP-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
