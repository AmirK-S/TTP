name: Debug Secrets
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: macos-latest
    steps:
      - name: Probe APPLE_CERTIFICATE shape
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set +e
          echo "secret_length_chars=$(printf '%s' "$APPLE_CERTIFICATE" | wc -c | tr -d ' ')"
          echo "first8_sha=$(printf '%s' "$APPLE_CERTIFICATE" | head -c 8 | shasum | awk '{print $1}')"
          echo "last8_sha=$(printf '%s' "$APPLE_CERTIFICATE" | tail -c 8 | shasum | awk '{print $1}')"
          echo "contains_newline=$(printf '%s' "$APPLE_CERTIFICATE" | grep -c $'\n')"

          CERT=$RUNNER_TEMP/probe.p12
          echo -n "$APPLE_CERTIFICATE" | base64 --decode --output "$CERT"
          echo "decoded_size_bytes=$(stat -f%z "$CERT")"
          echo "decoded_md5=$(md5 -q "$CERT")"
          echo "decoded_first_4_bytes_hex=$(xxd -l 4 -c 4 "$CERT" | awk '{print $2}')"

          echo "--- openssl pkcs12 info (cert only) ---"
          openssl pkcs12 -in "$CERT" -info -nokeys -passin "pass:$APPLE_CERTIFICATE_PASSWORD" 2>&1 | head -8

          echo "--- security import dry-run ---"
          KC=$RUNNER_TEMP/probe.keychain-db
          security create-keychain -p kctest "$KC"
          security unlock-keychain -p kctest "$KC"
          security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC" 2>&1
          security find-identity -v "$KC"
          security delete-keychain "$KC"
